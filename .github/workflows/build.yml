name: Build Cross-Platform Executables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pathfinder_visualizer

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Pathfinder.exe
            asset_name: pathfinder-windows-exe
          - os: ubuntu-latest
            artifact_name: Pathfinder
            asset_name: pathfinder-ubuntu-deb
          - os: macos-latest
            artifact_name: Pathfinder
            asset_name: pathfinder-macos-dmg

    steps:
    - uses: actions/checkout@v4

    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build Release
      run: cargo build --release

    - name: Build Debian Package
      if: matrix.os == 'ubuntu-latest'
      run: |
        cargo install cargo-deb
        cargo deb

    - name: Install create-dmg
      if: matrix.os == 'macos-latest'
      run: brew install create-dmg

    - name: Assemble macOS App Bundle
      if: matrix.os == 'macos-latest'
      run: |
        mkdir -p Pathfinder.app/Contents/{MacOS,Resources}
        cp target/release/Pathfinder Pathfinder.app/Contents/MacOS/
        chmod +x Pathfinder.app/Contents/MacOS/Pathfinder
        cat << 'EOF' > Pathfinder.app/Contents/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>Pathfinder</string>
            <key>CFBundleIdentifier</key>
            <string>com.juniperfuchs.pathfinder</string>
            <key>CFBundleName</key>
            <string>Pathfinder</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
        </dict>
        </plist>
        EOF

    - name: Sign macOS App Bundle
      if: matrix.os == 'macos-latest'
      run: |
        codesign --force --deep --sign - Pathfinder.app/

    - name: Create DMG Image
      if: matrix.os == 'macos-latest'
      run: |
        create-dmg \
          --volname "Pathfinder" \
          --window-pos 200 120 \
          --window-size 600 300 \
          --icon-size 100 \
          --app-drop-link 400 100 \
          "Pathfinder.dmg" \
          "Pathfinder.app"

    - name: Verify Windows Artifact
      if: matrix.os == 'windows-latest'
      run: |
        ls -lh target/release/Pathfinder.exe

    - name: Verify Ubuntu Artifact
      if: matrix.os == 'ubuntu-latest'
      run: |
        ls -lh target/debian/*.deb

    - name: Verify macOS Artifact
      if: matrix.os == 'macos-latest'
      run: |
        ls -lh Pathfinder.dmg
        file Pathfinder.dmg

    - name: Upload Windows Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: pathfinder-windows-exe
        path: pathfinder_visualizer/target/release/Pathfinder.exe

    - name: Upload Ubuntu DEB Artifact
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: pathfinder-ubuntu-deb
        path: pathfinder_visualizer/target/debian/*.deb

    - name: Upload macOS DMG Artifact
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: pathfinder-macos-dmg
        path: pathfinder_visualizer/Pathfinder.dmg